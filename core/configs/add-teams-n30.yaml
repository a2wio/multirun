# the rerun. add-teams at n=30, split two ways: fifteen sonnet, fifteen
# opus, same source sha and same task file as the July ten-run — so the
# arms are comparable to each other AND to what's already in the results
# db. The July post admitted a 5/5 split at n=10 can't pin a ratio; this
# widens the sonnet arm and adds the question the ten-run couldn't ask,
# which is whether a decision is model-shaped or task-shaped.
#
# ids carry the arm (s.. / o..) on purpose: run id becomes the branch,
# job and artifact name, so the model is legible everywhere without a
# join. The list is interleaved for the same reason the arms are equal —
# a fan-out cut short still leaves two balanced halves.
global:
  task: tasks/add-teams        # source + seed come from the task's source.yaml
  model: sonnet                # the default arm; the opus runs override below
  timeout: 30m
  max_parallel: 3              # one subscription feeds all runs; 3 is its ceiling
  neon:
    project: silent-sunset-50603321   # the dedicated multirun project
  env:
    # the node is small; keep each run's node processes from ballooning
    NODE_OPTIONS: "--max-old-space-size=1536"

runs:
  - id: s01
  - id: o01
    model: opus
    timeout: 45m               # opus is slower per turn; a timeout is a lost run
  - id: s02
  - id: o02
    model: opus
    timeout: 45m
  - id: s03
  - id: o03
    model: opus
    timeout: 45m
  - id: s04
  - id: o04
    model: opus
    timeout: 45m
  - id: s05
