[project]
name = "multirun"
version = "0.1.0"
description = "Fan out N isolated agent runs — a git worktree and a Neon branch per run — and diff what each one did."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
k8s = ["kubernetes>=29"]
results = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
multirun = "harness.cli:main"
multirun-runner = "harness.runner.entrypoint:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["**/*.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
