# the controller: plain Deployment, no CRD, no operator boilerplate.
# run state lives in the results database, not in etcd.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multirun-core
  namespace: {{ .Values.namespace }}
  labels:
    app: multirun-core
spec:
  replicas: 1
  strategy:
    type: Recreate            # one controller; two would double-spawn
  selector:
    matchLabels:
      app: multirun-core
  template:
    metadata:
      labels:
        app: multirun-core
    spec:
      serviceAccountName: multirun-core
      imagePullSecrets:
        - name: {{ .Values.secrets.registry }}
      containers:
        - name: core
          image: {{ .Values.images.core }}
          command:
            - multirun
            - watch
            - /etc/multirun
            - --runner-image
            - {{ .Values.images.runner }}
            - --namespace
            - {{ .Values.namespace }}
          env:
            - name: PYTHONUNBUFFERED   # logs are the interface; no buffering
              value: "1"
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.env }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: claude-creds
              mountPath: /creds/claude
              readOnly: true
            - name: fanout-config
              mountPath: /etc/multirun
              readOnly: true
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: claude-creds
          secret:
            secretName: {{ .Values.secrets.claudeCreds }}
            optional: true    # the pod must come up to LOG that creds are missing
        - name: fanout-config
          configMap:
            name: {{ .Values.controller.configMap }}
            optional: true
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.artifacts.claim }}
