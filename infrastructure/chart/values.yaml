namespace: multirun

images:
  # pinned, not :latest — argocd syncs this chart from main, and it must
  # never roll the controller because a build happened to finish
  core: registry.k6nis.dev/multirun-core:96d967c
  runner: registry.k6nis.dev/multirun-runner:96d967c

# secrets the chart expects but never creates — they carry credentials:
#   claude-creds          .credentials.json   (multirun creds push; rotates,
#                                              so it is never a git object)
#   multirun-secrets      NEON_API_KEY, RESULTS_DATABASE_URL — SealedSecret
#                         in kubeden/kubeden beside the rendered manifests
#   source-deploy-key     key (read-only, private sources) — SealedSecret,
#                         same place
#   registry-credentials  .dockerconfigjson — kyverno clones it into every
#                         namespace; nobody creates it here
secrets:
  claudeCreds: claude-creds
  env: multirun-secrets
  registry: registry-credentials

controller:
  # the controller's inbox: `multirun publish` writes fanout.yaml + stamp
  # here, the watch loop picks it up
  configMap: multirun-config

artifacts:
  claim: multirun-artifacts
  size: 5Gi
