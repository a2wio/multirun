namespace: multirun

images:
  core: registry.k6nis.dev/multirun-core:latest
  runner: registry.k6nis.dev/multirun-runner:latest

# secrets the chart expects but never creates — they carry credentials:
#   claude-creds          .credentials.json   (multirun creds push)
#   multirun-secrets      NEON_API_KEY, RESULTS_DATABASE_URL
#   source-deploy-key     key                 (read-only, for private sources)
#   registry-credentials  .dockerconfigjson   (pulls from the private registry)
secrets:
  claudeCreds: claude-creds
  env: multirun-secrets
  registry: registry-credentials

controller:
  # the controller's inbox: `multirun publish` writes fanout.yaml + stamp
  # here, the watch loop picks it up
  configMap: multirun-config

artifacts:
  claim: multirun-artifacts
  size: 5Gi
