# the live copy of this lives in kubeden/kubeden
# (k8s-cluster-configuration/applications/multirun/), his app-of-apps —
# argocd can't read this private repo, so the manifests it syncs are the
# rendered ones there. This file is the reference shape.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multirun
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeden/kubeden.git
    targetRevision: main
    path: k8s-cluster-configuration/applications/multirun/base
  destination:
    server: https://kubernetes.default.svc
    namespace: multirun
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
