# written, not applied — wiring argocd is the deploy phase
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multirun
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:a2wio/multirun.git
    targetRevision: main
    path: infrastructure/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: multirun
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
