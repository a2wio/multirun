# the live copy of this lives in kubeden/kubeden
# (k8s-cluster-configuration/applications/multirun/application.yml),
# his app-of-apps. This file is the reference shape.
#
# Two sources: argocd reads the chart straight from this repo (read-only
# deploy key; the repository credential is a SealedSecret in kubeden's
# platform/argocd), and the multirun SealedSecrets stay in kubeden —
# they are sealed against his cluster, so that is where they belong.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multirun
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:a2wio/multirun.git
      targetRevision: main
      path: infrastructure/chart
    - repoURL: https://github.com/kubeden/kubeden.git
      targetRevision: main
      path: k8s-cluster-configuration/applications/multirun/base
  destination:
    server: https://kubernetes.default.svc
    namespace: multirun
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
